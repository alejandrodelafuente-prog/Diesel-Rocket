<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cruce Diésel Rocket</title>
</head>
<body>
<div id="dc-root">
  <div id="dc-bar">
    <span class="dc-title">Cruce Diésel — Registro vs. MyGeotab</span>
    <label>Desde <input type="date" id="dc-from"></label>
    <label>Hasta <input type="date" id="dc-to"></label>
    <button id="dc-run">Analizar</button>
    <span id="dc-status"></span>
  </div>
  <div id="dc-kpis"></div>
  <div id="dc-tabs"></div>
  <div id="dc-panels"></div>
  <div id="dc-foot">Merma = litros despachados (registro Drive) − litros quemados por el motor (ECU MyGeotab, diagnóstico DiagnosticDeviceTotalFuelId). Distancia = suma de Trip. Ruido normal ≈ 300–400 L.</div>
</div>

<script>
if (typeof window.geotab === 'undefined') { window.geotab = {}; }
if (typeof window.geotab.addin === 'undefined') { window.geotab.addin = {}; }
window.geotab.addin.dieselCruce = function () {
  'use strict';

  /* ====== CONFIGURAR ESTO ====== */
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby6FhKTsGfGTIbpjrZmguxlKswzXn-6hvKhDq9NRyKuT7vmqp2KLO6dvOprvNYli1Ye/exec';
  var FUEL_DIAG = 'DiagnosticDeviceTotalFuelId';   // combustible acumulado (L), verificado en rocket_mx
  var LEVEL_DIAG = 'DiagnosticFuelLevelId';         // nivel de tanque (%), verificado en rocket_mx
  /* Mapa de respaldo unidad(registro) -> prefijo nombre en Geotab. El JSON del
     Apps Script también lo trae en "mapa_geotab" y tiene prioridad. */
  var MAP_FALLBACK = {
    TR08:'T08',TR10:'T10',TR14:'T14',TR15:'T15',TR16:'T16',TR17:'T17',
    TR32:'T32',TR33:'T33',TR34:'T34',TR37:'T37',R13:'R13',R38:'R38',
    V35:'V35',V36:'V36',V20:'V20'
  };
  /* ============================= */

  var api, elStatus, tank = null, devByName = [], lastRows = [];

  function initialize(freshApi, freshState, callback) {
    api = freshApi;
    injectCSS();
    var today = new Date();
    var first = new Date(today.getFullYear(), today.getMonth(), 1);
    document.getElementById('dc-from').value = iso_(first);
    document.getElementById('dc-to').value = iso_(today);
    elStatus = document.getElementById('dc-status');
    document.getElementById('dc-run').addEventListener('click', run);
    callback();
  }
  function focus(freshApi) { api = freshApi; }
  function blur() {}

  /* ---------- flujo principal ---------- */
  function run() {
    var from = document.getElementById('dc-from').value;
    var to   = document.getElementById('dc-to').value;
    if (!from || !to) { setStatus('Selecciona el rango de fechas.'); return; }
    setStatus('Leyendo registro de Drive…');
    fetchTank(from, to)
      .then(function (t) {
        tank = t;
        if (t.error) throw new Error('Apps Script: ' + t.error);
        setStatus('Consultando MyGeotab…');
        return loadDevices();
      })
      .then(function () { return loadGeotab(from, to); })
      .then(function (geo) {
        setStatus('');
        render(merge(tank, geo));
      })
      .catch(function (e) { setStatus('Error: ' + e.message); console.error(e); });
  }

  function fetchTank(from, to) {
    var url = APPS_SCRIPT_URL + '?from=' + from + '&to=' + to;
    return fetch(url, { method: 'GET' }).then(function (r) { return r.json(); });
  }

  function loadDevices() {
    return callP('Get', { typeName: 'Device', resultsLimit: 5000,
                          propertySelector: { fields: ['id', 'name', 'serialNumber', 'activeTo'] } })
      .then(function (devs) {
        devByName = devs.map(function (d) {
          return { id: d.id, name: (d.name || '').trim(),
                   serial: (d.serialNumber || ''), activeTo: d.activeTo || '' };
        });
      });
  }

  function findDeviceId(prefix) {
    // dispositivos cuyo nombre empieza con el prefijo (ignora sufijos/espacios)
    var p = prefix.toUpperCase();
    var hits = devByName.filter(function (d) { return d.name.toUpperCase().indexOf(p) === 0; });
    if (!hits.length) return null;
    if (hits.length === 1) return hits[0].id;
    // hay duplicados: preferir el ACTIVO con número de serie real (no '000…')
    var now = new Date();
    var real = hits.filter(function (d) {
      var serialOk = d.serial && d.serial.replace(/[^0-9]/g, '').replace(/0/g, '') !== '';
      var activeOk = !d.activeTo || (new Date(d.activeTo) > now);
      return serialOk && activeOk;
    });
    if (real.length) return real[0].id;
    // si ninguno pasa el filtro, al menos preferir serie real
    var rs = hits.filter(function (d) { return d.serial && d.serial.indexOf('000-000') !== 0; });
    return (rs.length ? rs[0] : hits[0]).id;
  }

  function loadGeotab(from, to) {
    var map = (tank && tank.mapa_geotab) ? tank.mapa_geotab : MAP_FALLBACK;
    var fromISO = from + 'T00:00:00.000Z';
    var toISO   = to   + 'T23:59:59.000Z';
    // ventanas estrechas para los extremos del combustible acumulado
    var startTo = addDays_(from, 7) + 'T00:00:00.000Z';
    var endFrom = addDays_(to, -7)  + 'T00:00:00.000Z';

    var units = Object.keys(map);
    var calls = [], meta = [];
    units.forEach(function (u) {
      var devId = findDeviceId(map[u]);
      if (!devId) { meta.push({ u: u, devId: null }); return; }
      meta.push({ u: u, devId: devId });
      // distancia (suma de Trip)
      calls.push(['Get', { typeName: 'Trip',
        search: { deviceSearch: { id: devId }, fromDate: fromISO, toDate: toISO },
        propertySelector: { fields: ['distance'] }, resultsLimit: 50000 }]);
      // combustible: extremo inicial
      calls.push(['Get', { typeName: 'StatusData',
        search: { deviceSearch: { id: devId }, diagnosticSearch: { id: FUEL_DIAG },
                  fromDate: fromISO, toDate: startTo }, resultsLimit: 5000 }]);
      // combustible: extremo final
      calls.push(['Get', { typeName: 'StatusData',
        search: { deviceSearch: { id: devId }, diagnosticSearch: { id: FUEL_DIAG },
                  fromDate: endFrom, toDate: toISO }, resultsLimit: 5000 }]);
    });

    return callP('multi', calls).then(function (res) {
      var out = {}, i = 0;
      meta.forEach(function (m) {
        if (!m.devId) { out[m.u] = { km: null, ecu: null, sinGps: true }; return; }
        var trips = res[i++], fs = res[i++], fe = res[i++];
        var km = (trips || []).reduce(function (s, t) { return s + (t.distance || 0); }, 0);
        var ecu = fuelDelta(fs, fe);
        out[m.u] = { km: round0(km), ecu: (ecu == null ? null : round0(ecu)) };
      });
      return out;
    });
  }

  function fuelDelta(startArr, endArr) {
    var minStart = pick(startArr, Math.min);
    var maxEnd   = pick(endArr,   Math.max);
    if (minStart == null || maxEnd == null) return null;
    return maxEnd - minStart;
  }
  function pick(arr, fn) {
    if (!arr || !arr.length) return null;
    return arr.reduce(function (acc, s) {
      var v = (typeof s.data === 'number') ? s.data : null;
      if (v == null) return acc;
      return acc == null ? v : fn(acc, v);
    }, null);
  }

  /* ---------- cruce ---------- */
  function merge(tankData, geo) {
    var map = tankData.mapa_geotab || MAP_FALLBACK;
    var byU = {};
    (tankData.rocket || []).forEach(function (r) { byU[r.unidad] = r; });
    var rows = Object.keys(map).map(function (u) {
      var t = byU[u] || { L_total: 0, categoria: '' };
      var g = geo[u] || { km: null, ecu: null };
      var disp = t.L_total || 0;
      var merma = (g.ecu != null) ? Math.round(disp - g.ecu) : null;
      var mp = (merma != null && disp) ? +(merma / disp * 100).toFixed(1) : null;
      var rend = (g.km != null && disp) ? +(g.km / disp).toFixed(2) : null;
      return { u: u, cat: t.categoria || '', Ldisp: Math.round(disp), km: g.km, ecu: g.ecu,
               rend: rend, merma: merma, merma_pct: mp, sev: sev(t.categoria, merma, mp, g) };
    }).filter(function (r) { return r.Ldisp > 0 || r.km; });
    rows.sort(function (a, b) { return (b.merma == null ? -1e9 : b.merma) - (a.merma == null ? -1e9 : a.merma); });
    return { rows: rows, tank: tankData };
  }
  function sev(cat, m, mp, g) {
    if (g && g.sinGps) return 'nogeo';
    if (cat === 'VAN' || (g && g.ecu == null)) return 'sensor';
    if (m == null) return 'nogeo';
    if (m > 500 && mp != null && mp > 10) return 'critico';
    if (m >= 300) return 'vigilar';
    if (m < -100) return 'externa';
    return 'ok';
  }

  /* ---------- render ---------- */
  function render(model) {
    var rows = model.rows, tk = model.tank;
    lastRows = rows;
    var crit = rows.filter(function (r) { return r.sev === 'critico'; });
    var warn = rows.filter(function (r) { return r.sev === 'vigilar'; });
    var flagged = rows.filter(function (r) { return ['critico', 'vigilar'].indexOf(r.sev) >= 0 && r.merma > 0; })
                      .reduce(function (s, r) { return s + r.merma; }, 0);
    var price = tk.tank_cost_per_l || 23.04;

    var kpis = [
      ['Foco crítico', crit.length ? crit.map(function (r) { return r.u; }).join(', ') : '—'],
      ['A vigilar', warn.length ? warn.map(function (r) { return r.u; }).join(', ') : '—'],
      ['Merma marcada', num(flagged) + ' L'],
      ['≈ Valor', money(flagged * price)]
    ];
    document.getElementById('dc-kpis').innerHTML = kpis.map(function (k) {
      return '<div class="dc-kpi"><div class="v">' + k[1] + '</div><div class="l">' + k[0] + '</div></div>';
    }).join('');

    var TABS = [
      ['focos', 'Focos rojos', function () { return focosHTML(crit, warn, tk, price); }],
      ['cruce', 'Cruce por unidad', function () { return cruceHTML(rows, price); }],
      ['consumo', 'Consumo', function () { return consumoHTML(tk); }],
      ['tanque', 'Tanque', function () { return tanqueHTML(tk); }],
      ['tte', 'TTE', function () { return tteHTML(tk); }]
    ];
    document.getElementById('dc-tabs').innerHTML = TABS.map(function (t, i) {
      return '<button class="dc-tab' + (i === 0 ? ' active' : '') + '" data-k="' + t[0] + '">' + t[1] + '</button>';
    }).join('');
    document.getElementById('dc-panels').innerHTML = TABS.map(function (t, i) {
      return '<div class="dc-panel' + (i === 0 ? ' active' : '') + '" id="dcp-' + t[0] + '">' + t[2]() + '</div>';
    }).join('');
    var tabsEl = document.getElementById('dc-tabs');
    tabsEl.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('.dc-tab') : null; if (!b) return;
      [].forEach.call(document.querySelectorAll('.dc-tab'), function (x) { x.classList.remove('active'); });
      [].forEach.call(document.querySelectorAll('.dc-panel'), function (x) { x.classList.remove('active'); });
      b.classList.add('active'); document.getElementById('dcp-' + b.getAttribute('data-k')).classList.add('active');
    };
    var cp = document.getElementById('dcp-cruce');
    if (cp) cp.addEventListener('click', function (e) {
      var trr = e.target.closest ? e.target.closest('tr[data-u]') : null;
      if (trr) openUnitDetail(trr.getAttribute('data-u'));
    });
  }

  var badge = function (s) {
    var m = { critico:['Crítico','c'], vigilar:['Vigilar','w'], ok:['OK','o'],
              sensor:['Sensor van','g'], externa:['Carga externa?','b'], nogeo:['Sin GPS','g'] };
    var x = m[s] || [s, 'o']; return '<span class="dc-b dc-b-' + x[1] + '">' + x[0] + '</span>';
  };
  function focosHTML(crit, warn, tk, price) {
    var h = '<div class="dc-card"><h3>Focos rojos y acciones</h3>';
    crit.forEach(function (g) {
      h += flag('c', g.u + ' — ' + num(g.merma) + ' L (' + pct(g.merma_pct) + ') · ~' + money(g.merma * price),
        'Despachados ' + num(g.Ldisp) + ' L vs. ' + num(g.ecu) + ' L quemados. Rend. real ' + f2(g.rend) +
        ' km/L. Auditar operador, rutas y despacho.');
    });
    if (warn.length) {
      var tot = warn.reduce(function (s, g) { return s + g.merma; }, 0);
      h += flag('w', 'A vigilar: ' + warn.map(function (g) { return g.u + ' +' + num(g.merma) + ' L'; }).join(' · '),
        'En conjunto ' + num(tot) + ' L (~' + money(tot * price) + '). Monitorear tendencia.');
    }
    var rec = tk.recon || {};
    Object.keys(rec).forEach(function (m) {
      if (rec[m].falt > 200)
        h += flag('w', 'Tanque mes ' + m + ': faltante de ' + num(rec[m].falt) + ' L',
          'La bomba despachó ' + num(rec[m].falt) + ' L más de lo ticketeado. Reforzar registro de despacho.');
    });
    if ((tk.odo_errores || []).length)
      h += flag('w', tk.odo_errores.length + ' errores de odómetro', 'Captura manual con saltos imposibles. Usar Geotab como fuente oficial.');
    return h + '</div>';
  }
  function flag(kind, head, det) {
    return '<div class="dc-flag ' + kind + '"><div class="h">' + head + '</div><div class="d">' + det + '</div></div>';
  }
  function cruceHTML(rows, price) {
    var head = ['Unidad', 'Cat', 'Despachado L', 'km Geotab', 'Motor ECU L', 'Rend km/L', 'Merma L', '%', 'Estado'];
    var body = rows.map(function (r) {
      var cls = (r.sev === 'critico' ? 'c' : (r.sev === 'vigilar' ? 'w' : '')) + ' clk';
      var cells = [r.u, r.cat, num(r.Ldisp), num(r.km), num(r.ecu), f2(r.rend), num(r.merma), pct(r.merma_pct), badge(r.sev)];
      return '<tr class="' + cls + '" data-u="' + r.u + '">' + cells.map(function (c, i) {
        return '<td class="' + (i === 0 ? 'u' : '') + '">' + (c == null ? '—' : c) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return card('Cruce por unidad — toca una unidad para ver su detalle ▾', table(head, body)) +
           '<div id="dc-unit"></div>';
  }

  /* ---------- detalle por unidad (se carga al hacer clic) ---------- */
  function openUnitDetail(u) {
    var host = document.getElementById('dc-unit'); if (!host) return;
    var row = (lastRows || []).filter(function (r) { return r.u === u; })[0] || {};
    var frec = ((tank && tank.rocket) || []).filter(function (x) { return x.unidad === u; })[0];
    var fills = frec ? (frec.fills || []) : [];
    host.innerHTML = '<div class="dc-card"><h3>Detalle · ' + u + ' — cargando…</h3></div>';
    host.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    var from = document.getElementById('dc-from').value, to = document.getElementById('dc-to').value;
    var devId = findDeviceId(((tank && tank.mapa_geotab) || MAP_FALLBACK)[u]);
    if (!devId) { renderUnitDetail(u, row, fills, null, null, null); return; }
    var fromISO = from + 'T00:00:00.000Z', toISO = to + 'T23:59:59.000Z';
    var calls = [
      ['Get', { typeName: 'Trip', search: { deviceSearch: { id: devId }, fromDate: fromISO, toDate: toISO },
        propertySelector: { fields: ['distance', 'start'] }, resultsLimit: 50000 }],
      ['Get', { typeName: 'StatusData', search: { deviceSearch: { id: devId }, diagnosticSearch: { id: FUEL_DIAG },
        fromDate: fromISO, toDate: toISO }, propertySelector: { fields: ['dateTime', 'data'] }, resultsLimit: 50000 }],
      ['Get', { typeName: 'StatusData', search: { deviceSearch: { id: devId }, diagnosticSearch: { id: LEVEL_DIAG },
        fromDate: fromISO, toDate: toISO }, propertySelector: { fields: ['dateTime', 'data'] }, resultsLimit: 50000 }]
    ];
    callP('multi', calls).then(function (res) {
      renderUnitDetail(u, row, fills, aggKmByDay(res[0]), aggFuelCumByDay(res[1]), aggLevelByDay(res[2]));
    }).catch(function (e) {
      host.innerHTML = '<div class="dc-card">No se pudo cargar el detalle: ' + e.message + '</div>';
    });
  }

  function groupAvg(cat) {
    var a = (lastRows || []).filter(function (r) { return r.cat === cat && r.rend != null; });
    if (!a.length) return null;
    return +(a.reduce(function (s, r) { return s + r.rend; }, 0) / a.length).toFixed(2);
  }
  function cumOnAxis(map, axis) { var out = [], run = 0; axis.forEach(function (l) { run += (map[l] || 0); out.push(run); }); return out; }
  function ffill(arr, axis) { var m = {}; (arr || []).forEach(function (p) { m[p.lab] = p.val; }); var out = [], last = 0; axis.forEach(function (l) { if (m[l] != null) last = m[l]; out.push(last); }); return out; }

  function renderUnitDetail(u, row, fills, kmDay, fuelCum, levelDay) {
    var host = document.getElementById('dc-unit');
    var cat = row.cat || '', gAvg = groupAvg(cat), hasGeo = !!(kmDay && kmDay.length);
    var kmMap = {}; (kmDay || []).forEach(function (p) { kmMap[p.lab] = p.val; });
    var fillMap = {}; fills.forEach(function (f) { fillMap[f.f] = (fillMap[f.f] || 0) + f.l; });
    var axisSet = {};
    (kmDay || []).forEach(function (p) { axisSet[p.lab] = 1; });
    fills.forEach(function (f) { axisSet[f.f] = 1; });
    (fuelCum || []).forEach(function (p) { axisSet[p.lab] = 1; });
    var axis = Object.keys(axisSet).sort();
    var cumKm = cumOnAxis(kmMap, axis), cumDisp = cumOnAxis(fillMap, axis), cumBurn = ffill(fuelCum, axis);
    var rendPts = axis.map(function (l, i) { return { f: l, v: cumDisp[i] > 0 ? (cumKm[i] / cumDisp[i]) : 0 }; });

    var refs = [{ v: row.rend, c: '#2f9e6f', t: 'Prom ' + u + ' ' + f2(row.rend) }];
    if (gAvg != null) refs.push({ v: gAvg, c: '#8b95a8', t: 'Prom ' + cat + ' ' + f2(gAvg) });

    var chart1 = hasGeo ? multiLine('Rendimiento acumulado (km/L)', [{ c: '#2e5496', pts: rendPts }], { min: 0, refs: refs }) : '';
    var chart2 = hasGeo ? multiLine('Despachado vs. quemado — acumulado (L)',
      [{ c: '#c9791f', pts: axis.map(function (l, i) { return { f: l, v: cumDisp[i] }; }) },
       { c: '#2e5496', pts: axis.map(function (l, i) { return { f: l, v: cumBurn[i] }; }) }], { min: 0}) : '';
    var leg2 = hasGeo ? '<div class="dc-lg"><span><i style="background:#c9791f"></i>Despachado (registro)</span><span><i style="background:#2e5496"></i>Quemado motor (ECU)</span></div>' : '';

    var litros = fills.map(function (f) { return { lab: f.f, val: f.l, ext: f.p !== 'Tanque' }; });
    var cargas = fills.slice().reverse().map(function (f) {
      return '<tr><td>' + f.f + '</td><td>' + f.p + '</td><td>' + num(f.l) + '</td><td>' + f2(f.c) + '</td><td>' + (f.o == null ? '—' : num(f.o)) + '</td></tr>';
    }).join('');
    var kpis = [[num(row.Ldisp) + ' L', 'Despachado'], [num(row.km) + (row.km == null ? '' : ' km'), 'km Geotab'],
      [num(row.ecu) + (row.ecu == null ? '' : ' L'), 'Motor ECU'], [f2(row.rend), 'Rend real'],
      [(row.merma == null ? '—' : num(row.merma) + ' L'), 'Merma'], [pct(row.merma_pct), 'Merma %']];
    var html = '<div class="dc-card dc-detail"><div class="dc-dhdr"><h3>Detalle · ' + u + '</h3>' +
      '<button class="dc-x" onclick="document.getElementById(\'dc-unit\').innerHTML=\'\'">Cerrar ✕</button></div>' +
      '<div class="dc-kpis6">' + kpis.map(function (k) { return '<div class="dc-kpi"><div class="v">' + k[0] + '</div><div class="l">' + k[1] + '</div></div>'; }).join('') + '</div>' +
      chart1 +
      chart2 + leg2 +
      barChart('Litros por carga (azul = tanque · ámbar = externo)', litros, {}) +
      (levelDay ? lineChart('Nivel de tanque por día', levelDay, { max: 100, unit: '%', color: '#2e5496' }) : '') +
      (hasGeo ? '' : '<div class="dc-empty">Sin telemetría de Geotab para esta unidad (solo se muestran las cargas).</div>') +
      '<div class="ct" style="margin-top:14px">Cargas (' + fills.length + ')</div>' +
      '<div class="dc-tblwrap"><table><thead><tr><th>Fecha</th><th>Fuente</th><th>Litros</th><th>$/L</th><th>Odómetro</th></tr></thead><tbody>' + cargas + '</tbody></table></div></div>';
    host.innerHTML = html;
    host.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* agregaciones por día */
  function dayKey(iso) { return String(iso).slice(0, 10); }
  function toSeries(m) { return Object.keys(m).sort().map(function (d) { return { lab: d.slice(5), val: m[d] }; }); }
  function aggKmByDay(trips) {
    var m = {}; (trips || []).forEach(function (t) { var d = dayKey(t.start); m[d] = (m[d] || 0) + (t.distance || 0); });
    return toSeries(m);
  }
  function aggLevelByDay(sd) {
    var s = {}, c = {}; (sd || []).forEach(function (x) { if (typeof x.data !== 'number') return; var d = dayKey(x.dateTime); s[d] = (s[d] || 0) + x.data; c[d] = (c[d] || 0) + 1; });
    var m = {}; Object.keys(s).forEach(function (d) { m[d] = s[d] / c[d]; }); return toSeries(m);
  }
  function aggFuelCumByDay(sd) {
    var last = {}; (sd || []).slice().sort(function (a, b) { return new Date(a.dateTime) - new Date(b.dateTime); })
      .forEach(function (x) { if (typeof x.data === 'number') last[dayKey(x.dateTime)] = x.data; });
    var days = Object.keys(last).sort(); if (!days.length) return [];
    var base = last[days[0]];
    return days.map(function (d) { return { lab: d.slice(5), val: last[d] - base }; });
  }

  /* ---------- gráficas (SVG, sin librerías) ---------- */
  function chartCard(title, inner) { return '<div class="dc-chart"><div class="ct">' + title + '</div><div class="dc-tblwrap">' + inner + '</div></div>'; }
  function svgCore(series, opts) {
    opts = opts || {};
    var labels = series[0].pts.map(function (p) { return p.f; }), n = labels.length;
    var w = Math.max(n * 30, 520), h = 200, padL = 46, padB = 24, padT = 10;
    var allv = []; series.forEach(function (s) { s.pts.forEach(function (p) { allv.push(p.v); }); });
    (opts.refs || []).forEach(function (r) { allv.push(r.v); });
    var max = (opts.max != null) ? opts.max : Math.max.apply(null, allv.concat([1])) * 1.08;
    var min = (opts.min != null) ? opts.min : Math.min.apply(null, allv.concat([0]));
    var iw = w - padL - 10, ih = h - padB - padT;
    var X = function (i) { return padL + (n > 1 ? i / (n - 1) * iw : 0); };
    var Y = function (v) { return padT + ih - ((Math.max(min, Math.min(max, v)) - min) / ((max - min) || 1)) * ih; };
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="min-width:' + w + 'px;height:210px">';
    for (var g = 0; g <= 4; g++) { var val = min + (max - min) * g / 4, y = Y(val);
      s += '<line x1="' + padL + '" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="#e3e8f2" stroke-width="1"/>';
      s += '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" font-size="9" fill="#8b95a8" text-anchor="end">' + Math.round(val).toLocaleString('es-MX') + '</text>'; }
    (opts.refs || []).forEach(function (r) { var y = Y(r.v);
      s += '<line x1="' + padL + '" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="' + r.c + '" stroke-width="1.5" stroke-dasharray="5 4"/>';
      s += '<text x="' + w + '" y="' + (y - 4) + '" font-size="9" fill="' + r.c + '" text-anchor="end">' + r.t + '</text>'; });
    series.forEach(function (se) {
      var d = se.pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
      s += '<path d="' + d + '" fill="none" stroke="' + se.c + '" stroke-width="2.5"/>';
    });
    var every = Math.ceil(n / 9) || 1;
    labels.forEach(function (l, i) { if (i % every === 0) s += '<text x="' + X(i) + '" y="' + (h - 8) + '" font-size="8" fill="#8b95a8" text-anchor="middle">' + l + '</text>'; });
    return s + '</svg>';
  }
  function multiLine(title, series, opts) { return chartCard(title, svgCore(series, opts)); }
  function lineChart(title, pts, opts) {
    opts = opts || {};
    if (!pts || !pts.length) return chartCard(title, '<div class="dc-empty">Sin datos</div>');
    var head = title + (opts.unit ? ' (' + opts.unit + ')' : '');
    return chartCard(head, svgCore([{ c: opts.color || '#2e5496', pts: pts.map(function (p) { return { f: p.lab, v: p.val }; }) }],
      { min: opts.min, max: opts.max }));
  }
  function barChart(title, items, opts) {
    opts = opts || {};
    if (!items || !items.length) return '<div class="dc-chart"><div class="ct">' + title + '</div><div class="dc-empty">Sin datos</div></div>';
    var max = Math.max.apply(null, items.map(function (i) { return i.val; }).concat([1]));
    var bars = items.map(function (i) {
      var hgt = Math.round((i.val / max) * 120);
      var col = i.ext ? '#c9791f' : (opts.color || '#2e5496');
      return '<div class="dc-bar"><span class="v">' + Math.round(i.val) + '</span><i style="height:' + hgt + 'px;background:' + col + '"></i><span class="l">' + i.lab + '</span></div>';
    }).join('');
    return '<div class="dc-chart"><div class="ct">' + title + '</div><div class="dc-bars">' + bars + '</div></div>';
  }
  function consumoHTML(tk) {
    var head = ['Unidad', 'Categoría', 'Cargas', 'L tanque', 'L externo', 'L TOTAL', 'Costo $'];
    var rocket = (tk.rocket || []).slice().sort(function (a, b) { return b.L_total - a.L_total; });
    var body = rocket.map(function (r) {
      return tr([r.unidad, r.categoria, num(r.cargas), num(r.L_tanque), num(r.L_externo), num(r.L_total), money(r.costo_total)], '');
    }).join('');
    return card('Consumo por unidad (registro)', table(head, body));
  }
  function tanqueHTML(tk) {
    var head = ['Mes', 'Bomba L', 'Ticketeado L', 'Faltante L', 'Lectura'];
    var rec = tk.recon || {};
    var body = Object.keys(rec).map(function (m) {
      var x = rec[m]; var w = x.falt > 200;
      return tr([x.mes, num(x.pump), num(x.tank_log), num(x.falt), w ? 'Revisar' : 'Cuadra'], w ? 'w' : '');
    }).join('');
    var chart = '';
    if (tk.tank_inv && tk.tank_inv.length) {
      var pts = tk.tank_inv.map(function (x) { return { lab: x.f, val: x.lvl }; });
      chart = '<div class="dc-card"><h3>Inventario del tanque de autoabasto (litros, calculado)</h3>' +
        '<p class="note">Sube con cada suministro y baja conforme las unidades cargan. Es un balance corrido: inventario inicial + entradas − despacho de la bomba.</p>' +
        lineChart('Inventario del tanque', pts, { unit: 'L', color: '#2f9e6f' }) + '</div>';
    }
    return chart + card('Reconciliación del tanque — bomba vs. tickets', table(head, body));
  }
  function tteHTML(tk) {
    var head = ['Unidad', 'Cargas', 'Litros', 'Facturado $', '$/L', 'A costo $', 'Dif.'];
    var body = (tk.tte || []).map(function (t) {
      return tr([t.unidad, num(t.cargas), num(t.L_total), money(t.costo_total), f2(t.precio_prom), money(t.a_costo), money(t.dif)],
                (t.precio_prom != null && t.precio_prom < (tk.tank_cost_per_l - 0.1)) ? 'w' : '');
    }).join('');
    var tt = tk.tte_tot || { litros: 0, fact: 0, costo: 0 };
    return card('TTE (tercero) — Total ' + num(tt.litros) + ' L · facturado ' + money(tt.fact) + ' · a costo ' + money(tt.costo),
                table(head, body));
  }

  /* ---------- helpers UI ---------- */
  function card(t, inner) { return '<div class="dc-card"><h3>' + t + '</h3>' + inner + '</div>'; }
  function table(head, body) {
    return '<div class="dc-tblwrap"><table><thead><tr>' +
      head.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
      '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  function tr(cells, cls) {
    return '<tr class="' + (cls || '') + '">' + cells.map(function (c, i) {
      return '<td class="' + (i === 0 ? 'u' : '') + '">' + (c == null ? '—' : c) + '</td>';
    }).join('') + '</tr>';
  }
  function setStatus(s) { if (elStatus) elStatus.textContent = s; }

  /* ---------- helpers Geotab / promesas ---------- */
  function callP(kind, arg) {
    return new Promise(function (resolve, reject) {
      if (kind === 'multi') api.multiCall(arg, resolve, reject);
      else api.call(kind, arg, resolve, reject);
    });
  }

  /* ---------- format ---------- */
  function num(n) { return n == null ? '—' : Math.round(n).toLocaleString('es-MX'); }
  function money(n) { return n == null ? '—' : '$' + Math.round(n).toLocaleString('es-MX'); }
  function f2(n) { return n == null ? '—' : n.toFixed(2); }
  function pct(n) { return n == null ? '—' : n.toFixed(1) + '%'; }
  function round0(n) { return Math.round(n); }
  function iso_(d) { return d.toISOString().slice(0, 10); }
  function addDays_(s, n) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

  /* ---------- CSS inyectado vía JS (los <style> se eliminan al inyectar el add-in) ---------- */
  function injectCSS() {
    var css = [
      '#dc-root{--blue:#2e5496;--navy:#1f3864;--amber:#c9791f;--green:#2f9e6f;--muted:#647089;--line:#e6ebf3;--card:#ffffff;--ink:#1b2130;--red:#d64550;--bg:#eef1f7;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);font-size:14px;background:var(--bg);padding:16px;border-radius:14px}',
      '#dc-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:-16px -16px 16px;padding:16px 18px;background:linear-gradient(120deg,#1f3864,#2e5496);border-radius:14px 14px 0 0;color:#fff}',
      '#dc-bar .dc-title{font-weight:800;font-size:16px;margin-right:6px;color:#fff;letter-spacing:-.2px}',
      '#dc-bar label{font-size:12px;color:#dce6f7;display:inline-flex;gap:6px;align-items:center}',
      '#dc-bar input{padding:6px 9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(255,255,255,.12);color:#fff}',
      '#dc-bar input::-webkit-calendar-picker-indicator{filter:invert(1)}',
      '#dc-run{background:#fff;color:#1f3864;border:0;border-radius:8px;padding:8px 18px;font-weight:800;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}',
      '#dc-run:hover{background:#eaf0fb}',
      '#dc-status{color:#dce6f7;font-size:12.5px}',
      '#dc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}',
      '.dc-kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:0 1px 3px rgba(20,40,80,.05);border-top:3px solid var(--blue)}',
      '.dc-kpi .v{font-size:19px;font-weight:800;color:var(--navy)}.dc-kpi .l{font-size:11px;color:var(--muted);margin-top:3px}',
      '#dc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}',
      '.dc-tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 15px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:700;box-shadow:0 1px 2px rgba(20,40,80,.04)}',
      '.dc-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 6px rgba(46,84,150,.35)}',
      '.dc-panel{display:none}.dc-panel.active{display:block}',
      '.dc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,40,80,.06)}',
      '.dc-card h3{font-size:15px;margin:0 0 4px;color:var(--navy)}',
      '.dc-card .note{color:var(--muted);font-size:12px;margin:0 0 12px}',
      '.dc-flag{border-radius:12px;padding:13px 15px;margin-bottom:9px;border:1px solid var(--line);border-left-width:4px}',
      '.dc-flag.c{background:#fdeef0;border-left-color:var(--red)}.dc-flag.w{background:#fbf3e3;border-left-color:var(--amber)}',
      '.dc-flag .h{font-weight:800;font-size:14px;color:var(--ink)}.dc-flag .d{font-size:12.5px;color:#42506a;margin-top:3px}',
      '.dc-tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}',
      'table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}',
      'th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}',
      'th:first-child,td:first-child{text-align:left}',
      'thead th{background:#f3f6fc;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}',
      'td.u{font-weight:800;color:var(--navy)}',
      'tbody tr:hover td{background:#f7f9fd}',
      'tr.c td{background:#fdeef0}tr.w td{background:#fbf3e3}',
      'tr.clk{cursor:pointer}',
      '.dc-detail{border:2px solid var(--blue);box-shadow:0 4px 16px rgba(46,84,150,.15)}',
      '.dc-dhdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}',
      '.dc-dhdr h3{font-size:17px}',
      '.dc-x{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600}',
      '.dc-x:hover{background:#f3f6fc}',
      '.dc-kpis6{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:9px;margin:12px 0 16px}',
      '.dc-kpis6 .dc-kpi{border-top-width:3px}',
      '.dc-chart{margin:16px 0}.dc-chart .ct{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:8px}',
      '.dc-lg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:-6px 0 4px}',
      '.dc-lg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}',
      '.dc-bars{display:flex;align-items:flex-end;gap:5px;height:165px;overflow-x:auto;padding-bottom:20px}',
      '.dc-bar{flex:0 0 auto;width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}',
      '.dc-bar i{width:20px;border-radius:5px 5px 0 0;display:block}',
      '.dc-bar .v{font-size:8.5px;color:var(--muted);margin-bottom:3px}',
      '.dc-bar .l{position:absolute;bottom:-18px;font-size:8px;color:var(--muted);transform:rotate(-42deg);transform-origin:top left;left:9px;white-space:nowrap}',
      '.dc-empty{color:var(--muted);font-size:12px;padding:10px 0}',
      '.dc-b{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;text-transform:uppercase;letter-spacing:.3px}',
      '.dc-b-c{background:var(--red)}.dc-b-w{background:var(--amber)}.dc-b-o{background:var(--green)}.dc-b-g{background:#8b95a8}.dc-b-b{background:var(--blue)}',
      '#dc-foot{color:var(--muted);font-size:11px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}'
    ].join('\n');
    var s = document.createElement('style');
    s.type = 'text/css';
    s.appendChild(document.createTextNode(css));
    document.head.appendChild(s);
  }

  return { initialize: initialize, focus: focus, blur: blur };
};
</script>
